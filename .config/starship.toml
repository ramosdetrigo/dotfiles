"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
format = """$time\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
${custom.a}\
$line_break\
$python\
$character"""

[directory]
style = "purple"
truncate_to_repo = false
truncation_length = -1

[username]
show_always = true
format = "[$user]($style) "
style_user = "bold blue"

[time]
disabled = false
format = "[$time]($style) "
style = ""
time_format = "%H:%M"

[character]
success_symbol = "[❯](yellow)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bold"

[git_status]
format = "[$conflicted$untracked$modified$staged$renamed$deleted $ahead_behind$stashed]($style)"
style = "cyan"
untracked = "▪"
modified = "•"
deleted = "✖"
staged = "✚"
ahead = '↑$count'
behind = '↓$count'
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[custom.a]
command = '($env.CMD_DURATION_MS | into int) / 1000'
when = "if (($env.CMD_DURATION_MS | into int) < 2000) {exit 1}"
style = "bold white"
format = "[$output]($style)s"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []
