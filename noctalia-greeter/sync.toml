# noctalia-greeter sync.toml (UI + Sync; not managed by Nix)
# [session] last, [session.power] suspend/reboot/shutdown, [[session.actions]] action/command/label/glyph
# [appearance] scheme, theme_mode, corner_radius_scale, font_family
# [appearance.palette] full color role table, [appearance.wallpaper]/[appearance.wallpapers.<connector>]
# [output] layout/transforms/scales

[appearance]
corner_radius_scale = 0.0
font_family = "Maple Mono"
scheme = "Synced"
theme_mode = "dark"

    [appearance.palette]
    error = "#FFB4AB"
    hover = "#F6B8AD"
    on_error = "#690005"
    on_hover = "#4C251F"
    on_primary = "#49204E"
    on_secondary = "#3B2B3C"
    on_surface = "#EBDFE6"
    on_surface_variant = "#D0C3CC"
    on_tertiary = "#4C251F"
    outline = "#4D444C"
    primary = "#EBB5EC"
    secondary = "#D7BFD5"
    shadow = "#000000"
    surface = "#171216"
    surface_variant = "#231E23"
    tertiary = "#F6B8AD"

[output]
layout = "DP-1:0,0; HDMI-A-1:1440,-900"
transforms = "DP-1:normal; HDMI-A-1:90"

[session]
last = "Niri"

    [[session.actions]]
    action = "lock"

    [[session.actions]]
    action = "logout"

    [[session.actions]]
    action = "lock_and_suspend"

    [[session.actions]]
    action = "reboot"

    [[session.actions]]
    action = "shutdown"