[osd.kinds]
lock_keys = false

[plugins]
enabled = [
    "jubii/color-picker",
    "jubii/timer",
    "cleboost/zed-provider",
    "dotnetrob/cat",
    "ramosdetrigo/godot-provider",
    "nightwatch75/todo",
    "noctalia/notes"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    enabled = false
    kind = "git"
    location = "https://github.com/ramosdetrigo/noctalia-plugins"
    name = "jubii"

    [[plugins.source]]
    kind = "path"
    location = "~/Desktop/Projects/Noctalia"
    name = "jubii-local"

[shell]
corner_radius_scale = 0.0
font_family = "Maple Mono"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true

    [shell.screenshot]
    copy_to_clipboard = false
    directory = "/home/julia/Pictures/Screenshots"
    filename_pattern = "satty -f -"
    pipe_command = "satty --show -f -"
    pipe_to_command = true
    save_to_file = false

[theme]
builtin = "Noctalia"
community_palette = "Ayu Red"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "niri", "qt" ]
    community_ids = [ "spicetify", "discord" ]

[wallpaper]
directory = "/home/julia/Pictures/wallpapers"
per_monitor_directories = true
transition = [ "stripes" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/julia/Pictures/wallpapers/tcws.png"

    [wallpaper.last]
    path = "/home/julia/Pictures/wallpapers/tcws.png"

    [wallpaper.monitor.DP-1]
    directory = "/home/julia/Pictures/wallpapers"
    directory_light = ""

    [wallpaper.monitor.HDMI-A-1]
    directory = "/home/julia/Pictures/wallpapers"
    enabled = true

    [wallpaper.monitors.DP-1]
    path = "/home/julia/Pictures/wallpapers/tcws.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/julia/Pictures/wallpapers/tcws2.png"

[weather]
refresh_minutes = 10

[widget.cat]
show_cpu_percent = true
type = "dotnetrob/cat:cat"

[widget.clock]
color = "secondary"
tooltip_format = "{:%H:%M:%S}"
vertical_format = "{:%H\\n·\\n%M}"

[widget.media]
capsule = true
hide_when_no_media = true

[widget.network]
show_label = false

[widget.notes]
type = "noctalia/notes:notes"

[widget.session]
color = "error"

[widget.volume]
show_label = false

[widget.widget]
type = "jubii/color-picker:widget"